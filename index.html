<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>G.L.U.T.T. — iPhone Prototype</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;color:#d9e0e7;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100vh;background:#080b10}#hud{position:fixed;inset:env(safe-area-inset-top) 0 auto 0;padding:10px 14px;display:flex;justify-content:space-between;pointer-events:none;font-weight:700;text-shadow:0 2px 4px #000}.bar{width:110px;height:9px;background:#222;border:1px solid #555;border-radius:8px;overflow:hidden}.fill{height:100%;width:100%;background:#63d56f}.small{font-size:12px}.pad{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.cluster{display:flex;gap:10px;pointer-events:auto}.btn{width:62px;height:62px;border-radius:50%;border:2px solid #9aa5b1;background:rgba(30,38,48,.72);color:white;font-size:25px;font-weight:800;display:grid;place-items:center;user-select:none;-webkit-user-select:none}.btn.wide{width:72px;height:52px;border-radius:18px;font-size:14px}.btn:active{background:rgba(100,120,140,.9)}#hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 18px;border:1px solid #555;background:rgba(0,0,0,.65);border-radius:10px;pointer-events:none;text-align:center}.hidden{display:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div><div>HP <span id="hpText">100</span></div><div class="bar"><div id="hp" class="fill"></div></div></div><div style="text-align:right"><div>DNA <span id="dnaText">0</span> · AMMO <span id="ammoText">12</span></div><div class="small">STAMINA <span id="stText">100</span></div></div></div><div id="hint">Tap the controls to move<br>◀ ▶ move · ▲ jump · ⚡ dash · ● attack</div><div class="pad"><div class="cluster"><div class="btn" data-k="left">◀</div><div class="btn" data-k="right">▶</div></div><div class="cluster"><div class="btn wide" data-k="dash">DASH</div><div class="btn" data-k="jump">▲</div><div class="btn" data-k="attack">●</div></div></div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr,keys={};function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const p={x:120,y:0,w:28,h:42,vx:0,vy:0,onGround:false,jumps:0,hp:100,st:100,dna:0,ammo:12,face:1,attack:0};let cam=0,worldW=3600,started=false,shake=0;
const platforms=[{x:0,y:H-90,w:worldW,h:90},{x:360,y:H-190,w:240,h:22},{x:720,y:H-290,w:260,h:22},{x:1110,y:H-170,w:260,h:22},{x:1490,y:H-260,w:300,h:22},{x:1940,y:H-180,w:280,h:22},{x:2350,y:H-310,w:300,h:22},{x:2800,y:H-210,w:260,h:22},{x:3200,y:H-300,w:300,h:22}];
const enemies=[{x:560,y:0,w:32,h:44,vx:-.6,hp:40,base:560},{x:930,y:0,w:32,h:44,vx:.7,hp:40,base:930},{x:1710,y:0,w:34,h:46,vx:-.8,hp:70,base:1710},{x:2470,y:0,w:34,h:46,vx:.7,hp:70,base:2470},{x:3320,y:0,w:48,h:58,vx:.45,hp:150,base:3320}];
function bind(el,code){el.addEventListener('pointerdown',e=>{e.preventDefault();keys[code]=true;if(!started){started=true;document.getElementById('hint').classList.add('hidden')}});['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,e=>{keys[code]=false}))}document.querySelectorAll('.btn').forEach(b=>bind(b,b.dataset.k));addEventListener('keydown',e=>{keys[e.code]=true;started=true;document.getElementById('hint').classList.add('hidden')});addEventListener('keyup',e=>keys[e.code]=false);
function jump(){if(p.onGround||p.jumps<2){p.vy=-11;p.onGround=false;p.jumps++}}function attack(){if(p.attack<=0){p.attack=12;if(p.ammo>0)p.ammo--}}
let last=performance.now();function loop(t){let dt=Math.min((t-last)/16.67,2);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function update(dt){if(!started)return;const left=keys.left||keys.ArrowLeft||keys.KeyA,right=keys.right||keys.ArrowRight||keys.KeyD;let run=keys.dash||keys.ShiftLeft||keys.ShiftRight;let ax=(right?1:0)-(left?1:0);if(ax){p.vx+=ax*(run?0.65:0.45)*dt;p.face=ax} else p.vx*=Math.pow(.78,dt);let max=run&&p.st>0?7.8:4.8;if(run&&ax&&p.st>0)p.st=Math.max(0,p.st-1.1*dt);else p.st=Math.min(100,p.st+.55*dt);p.vx=Math.max(-max,Math.min(max,p.vx));if((keys.jump||keys.ArrowUp||keys.KeyW||keys.Space)&&!keys._jump){jump();keys._jump=true}if(!(keys.jump||keys.ArrowUp||keys.KeyW||keys.Space))keys._jump=false;if(keys.attack||keys.KeyJ||keys.KeyK)attack();if((keys.dash||keys.ShiftLeft||keys.ShiftRight)&&ax&&p.st>10){p.vx=ax*12;p.st-=10;keys.dash=false}p.vy+=.62*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.onGround=false;for(const q of platforms){if(p.x+p.w>q.x&&p.x<q.x+q.w&&p.y+p.h>=q.y&&p.y+p.h<=q.y+24&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.onGround=true;p.jumps=0}}if(p.y>H+100){p.x=100;p.y=H-300;p.hp-=15}p.x=Math.max(0,Math.min(worldW-p.w,p.x));for(const e of enemies){if(e.hp<=0)continue;if(!e._init){e.y=H-90-e.h;e._init=true}e.x+=e.vx*dt;if(Math.abs(e.x-e.base)>120)e.vx*=-1;let dx=(p.x+p.w/2)-(e.x+e.w/2),dy=(p.y+p.h/2)-(e.y+e.h/2);if(Math.abs(dx)<260&&Math.abs(dy)<100){e.vx=Math.sign(dx)*1.1; if(Math.abs(dx)<48){p.hp-=.28*dt;shake=4}}if(p.attack>0&&Math.abs(dx)<70&&Math.abs(dy)<60){e.hp-=2.8*dt;shake=3}}p.attack=Math.max(0,p.attack-dt);for(const e of enemies){if(e.hp<=0&&!e.dead){e.dead=true;p.dna+=10}}cam+=(p.x-W*.35-cam)*.08;cam=Math.max(0,Math.min(worldW-W,cam));if(shake>0)shake-=dt;document.getElementById('hpText').textContent=Math.max(0,Math.round(p.hp));document.getElementById('hp').style.width=Math.max(0,p.hp)+'%';document.getElementById('stText').textContent=Math.round(p.st);document.getElementById('ammoText').textContent=p.ammo;document.getElementById('dnaText').textContent=p.dna}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(-cam+(shake?Math.random()*shake-shake/2:0),shake?Math.random()*shake-shake/2:0);ctx.fillStyle='#0c1118';ctx.fillRect(cam,0,W,H);for(let x=Math.floor(cam/80)*80;x<cam+W+80;x+=80){ctx.fillStyle=x%160?'#101820':'#141d26';ctx.fillRect(x,0,78,H-90)}for(const q of platforms){ctx.fillStyle='#39434e';ctx.fillRect(q.x,q.y,q.w,q.h);ctx.fillStyle='#687684';ctx.fillRect(q.x,q.y,q.w,4)}for(const e of enemies){if(e.hp<=0)continue;ctx.fillStyle=e.hp>100?'#9a3b55':'#bd7749';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#111';ctx.fillRect(e.x+6,e.y+10,e.w-12,7)}ctx.fillStyle='#65b6d8';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#d7edf5';ctx.fillRect(p.x+(p.face>0?18:4),p.y+8,6,6);if(p.attack>0){ctx.fillStyle='#f0d16a';ctx.fillRect(p.face>0?p.x+p.w:p.x-32,p.y+14,32,5)}ctx.fillStyle='#222';ctx.font='14px system-ui';ctx.fillText('G.L.U.T.T. // FACILITY',p.x-20,p.y-14);ctx.restore()}
</script></body></html>
